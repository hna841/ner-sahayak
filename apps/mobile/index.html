<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NER Sahayak Mobile</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --void: #0e1012;
      --panel: #15171b;
      --raised: #1c1f24;
      --overlay: #23262d;
      --text-primary: #ffffff;
      --text-body: #a0aaba;
      --text-caption: #8b96aa;
      --accent: #007afc;
      --status-critical: #ef4444;
      --status-watch: #f59e0b;
      --status-clear: #228a56;
      --glass-border: rgba(255, 255, 255, 0.05);
    }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--void);
      color: var(--text-body);
      min-height: 100vh;
    }

    /* Header styling */
    header {
      padding: 1.5rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border-bottom: 1px solid var(--glass-border);
    }
    
    #app-title {
      color: var(--text-primary);
      font-size: 1.5rem;
      margin: 0;
      font-weight: 700;
    }

    .container {
      padding: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Glassmorphism Card System */
    .glass-card {
      background: var(--panel);
      border-radius: 24px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      /* no drop shadow per design system */
    }
    
    .glass-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 1.2rem;
    }

    /* Status Board Rows */
    #status-board { margin-bottom: 2rem; }
    .district-row {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      background: var(--raised);
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .status-isolated { border-left: 4px solid var(--status-critical); }
    .status-degraded { border-left: 4px solid var(--status-watch); }
    .status-connected { border-left: 4px solid var(--status-clear); }

    /* Forms and Inputs */
    input, select, textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      margin-bottom: 1.2rem;
      background: var(--raised);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-caption);
    }
    
    select option {
      background: var(--raised);
      color: var(--text-primary);
    }

    /* Buttons */
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 100px;
      font-size: 1.1rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:disabled { 
      background: var(--raised);
      color: var(--text-caption);
      cursor: not-allowed;
    }

    /* Range Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
      padding: 0;
      border: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      margin-top: -8px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: var(--raised);
      border-radius: 2px;
    }

    /* Badges & Utility */
    .hidden { display: none !important; }
    
    #pending-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7em;
      background: var(--status-watch);
      color: #000;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    
    .header-controls {
      display: flex;
      align-items: center;
    }
    
    #lang-select {
      width: auto;
      margin: 0;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
      background: var(--raised);
      color: var(--text-primary);
    }
    
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-body);
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="app-title">NER Sahayak (Dima Hasao)</h1>
    <div class="header-controls">
      <span id="pending-badge" class="hidden">Pending Sync</span>
      <select id="lang-select">
        <option value="en">EN</option>
        <option value="hi">HI</option>
        <option value="as">AS</option>
      </select>
    </div>
  </header>

  <div id="auth-view" class="container hidden">
    <div class="glass-card">
      <h2 id="login-title">Welcome Back!</h2>
      <p style="color: var(--text-muted); margin-top: -1rem; margin-bottom: 1.5rem; font-size: 0.9rem;">Login to report incidents or view alerts</p>
      
      <input type="email" id="auth-email" placeholder="Email Address" />
      <input type="password" id="auth-pass" placeholder="Password" />
      <button id="auth-submit" style="margin-bottom: 1rem;">Login ➔</button>
      <div style="text-align: center; margin-bottom: 1rem; color: var(--text-muted); font-size: 0.85rem;">OR</div>
      <button id="auth-demo" style="background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); box-shadow: none;">Quick Login (Demo)</button>
      <button id="auth-google" style="margin-top: 1rem; background: white; color: #374151; border: 1px solid #d1d5db; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-weight: 500;">
        <svg style="width:1.25rem; height:1.25rem;" viewBox="0 0 24 24">
          <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <div id="app-view" class="container hidden">
    <section class="glass-card">
      <h2 id="status-title">Live Incident Map - NH-27 (Dima Hasao)</h2>
      <div id="map-container" style="height: 250px; width: 100%; border-radius: 12px; margin-bottom: 0.75rem; z-index: 1; border: 1px solid var(--glass-border);"></div>
      <style>
        .safe-route-btn { width: 100%; margin-bottom: 0.5rem; }
        .safe-route-btn[hidden] { display: none; }
        .safe-route-status { display: block; text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; min-height: 1.1em; }
      </style>
      <div id="status-board" style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem;">
        <!-- Rendered from local Dexie -->
        <div style="padding:1rem; text-align:center; color:var(--text-muted);">Loading status...</div>
      </div>
      <style>
        .gauge-arc {
          transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gauge-text-score {
          font-family: 'IBM Plex Mono', monospace;
          font-weight: 700;
          font-size: 22px;
          fill: var(--text-main);
          text-anchor: middle;
          dominant-baseline: mathematical;
        }
        .gauge-text-label {
          font-family: 'Inter', sans-serif;
          font-weight: 600;
          font-size: 11px;
          fill: var(--text-muted);
          text-anchor: middle;
        }
        .gauge-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.5rem;
        }
        .gauge-name {
          font-size: 0.85rem;
          font-weight: 600;
          color: var(--text-main);
        }
      </style>
    </section>

    <div class="glass-card" id="report-card">
      <h2 id="report-title">Submit a New Report</h2>
      
      <label>Incident Type</label>
      <select id="report-type">
        <option value="landslide">Landslide</option>
        <option value="washout">Road Washout</option>
        <option value="accident">Accident</option>
      </select>
      
      <label id="severity-label">Severity Level (1-5)</label>
      <input type="range" id="report-severity" min="1" max="5" value="3">
      <div id="risk-preview" style="margin-bottom:1.5rem; font-size:0.9rem; color:var(--text-body); font-weight: 500;">Moderate Risk</div>
      
      <label>Photo Evidence (Optional)</label>
      <input type="file" id="report-photo" accept="image/*" capture="environment" style="background: transparent; border: none; padding: 0.5rem 0;" />
      <img id="photo-preview" src="" alt="Photo preview" style="display:none; width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-bottom:1rem; border:1px solid var(--glass-border);" />

      <label>Details</label>
      <textarea id="report-desc" placeholder="Describe the incident..." rows="3"></textarea>

      <!-- GPS status: shown live as location is captured, non-blocking -->
      <div id="gps-status" style="margin-bottom:1.2rem; font-size:0.82rem; color:var(--text-caption); display:flex; align-items:center; gap:0.5rem;">
        <span id="gps-dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--text-caption); flex-shrink:0;"></span>
        <span id="gps-label">📍 Waiting for GPS...</span>
      </div>
      
      <button id="report-submit">Submit Report</button>
    </div>
  </div>

  <!-- Confirmation card: shown after successful submit, hidden otherwise -->
  <div id="confirm-overlay" class="container hidden" style="position:fixed; inset:0; background:rgba(14,16,18,0.95); z-index:999; display:flex; align-items:center; justify-content:center; padding:1.2rem;">
    <div class="glass-card" style="width:100%; max-width:480px; margin:0;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="font-size:2.5rem; margin-bottom:0.5rem;">✅</div>
        <h2 style="margin:0; color:var(--text-primary); font-size:1.3rem;">Report Filed</h2>
        <p style="color:var(--text-caption); font-size:0.85rem; margin:0.5rem 0 0;">Stored locally — will sync when online</p>
      </div>
      <img id="confirm-photo" src="" alt="" style="display:none; width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-bottom:1rem; border:1px solid var(--glass-border);" />
      <div id="confirm-details" style="background:var(--raised); border-radius:12px; padding:1rem; margin-bottom:1.2rem; font-size:0.875rem; line-height:1.7; color:var(--text-body);"></div>
      <button id="confirm-share" style="margin-bottom:0.75rem;">📤 Share Report</button>
      <button id="confirm-close" style="background:var(--raised); border:1px solid var(--glass-border); color:var(--text-primary);">Back to App</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
